<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Listening Post — new releases on Spotify</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:        oklch(0.17 0.006 60);
    --bg-2:      oklch(0.21 0.007 60);
    --bg-3:      oklch(0.25 0.008 60);
    --line:      oklch(0.32 0.008 60);
    --line-soft: oklch(0.27 0.008 60);
    --fg:        oklch(0.95 0.006 80);
    --fg-2:      oklch(0.78 0.008 70);
    --fg-3:      oklch(0.58 0.01 70);
    --accent:    oklch(0.80 0.14 65);
    --accent-2:  oklch(0.66 0.14 50);
    --danger:    oklch(0.70 0.13 25);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg);
    font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  body { min-height: 100vh; }
  .serif { font-family: "Newsreader", Georgia, serif; font-weight: 500; letter-spacing: -0.01em; }
  .mono  { font-family: "IBM Plex Mono", ui-monospace, monospace; }

  ::selection { background: var(--accent); color: var(--bg); }

  /* scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--line-soft); }

  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  input { font: inherit; color: inherit; }

  /* shared */
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 8px; border-radius: 999px;
    border: 1px solid var(--line);
    font-family: "IBM Plex Mono", monospace; font-size: 11px;
    color: var(--fg-2); letter-spacing: 0.02em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .pill.solid { background: var(--bg-3); border-color: var(--line-soft); color: var(--fg); }
  .pill.accent { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 50%, transparent); }
  .dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; display: inline-block; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

  <script type="text/babel" src="data.jsx?v=2"></script>
  <script type="text/babel" src="cover.jsx?v=2"></script>

  <script type="text/babel" src="grid.jsx?v=2"></script>
  <script type="text/babel" src="drawer.jsx?v=2"></script>

</body>
</html>
